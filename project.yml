name: WordWhiz
options:
  bundleIdPrefix: com.wordwhiz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.0"

targets:
  WordWhiz:
    type: application
    platform: macOS
    sources:
      - WordWhiz
    settings:
      base:
        INFOPLIST_FILE: WordWhiz/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WordWhiz/Resources/WordWhiz.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.wordwhiz.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: HotKey
    info:
      path: WordWhiz/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: WordWhiz
        CFBundleShortVersionString: "0.0.2"
        NSAccessibilityUsageDescription: "WordWhiz needs Accessibility permission to read selected text in other applications and register global keyboard shortcuts."
